workflows:
  android-release:
    name: Scanner Pro — Android Release
    max_build_duration: 120
    environment:
      node: 22.13.1
      java: 21
      vars:
        PACKAGE_NAME: "com.scanpro.app"
      groups:
        # Create this group in Codemagic → Teams → Global variables & secrets
        # Add these four variables to it (see CLOUD_BUILD_SETUP.md for values):
        #   CM_KEYSTORE         — base64-encoded .keystore (PKCS12) file
        #   CM_KEYSTORE_PASSWORD
        #   CM_KEY_ALIAS
        #   CM_KEY_PASSWORD
        - keystore_credentials

    # Safe caches — only downloaded artifacts, never compiled outputs.
    # DO NOT cache android/app/build: stale incremental state across machines
    # causes Gradle to hang for hours re-validating broken cached outputs.
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.local/share/pnpm/store

    scripts:
      # ── 1. Install pnpm ───────────────────────────────────────────────────
      #    Use nvm install as fallback in case node 22 isn't pre-loaded yet.
      #    Skip reinstalling pnpm if v9 is already present.
      - name: Install pnpm
        script: |
          nvm use 22 2>/dev/null || (nvm install 22 && nvm use 22)
          node --version
          pnpm --version 2>/dev/null | grep -q "^9\." || npm install -g pnpm@9

      # ── 2. Install workspace dependencies ────────────────────────────────
      #    --no-frozen-lockfile: pnpm@9 would reject the v10 lockfile format.
      #    Do NOT use --prefer-offline: if pnpm store cache is cold it hangs.
      - name: Install dependencies
        script: |
          pnpm install --no-frozen-lockfile

      # ── 3. Build the web app (Vite) ───────────────────────────────────────
      - name: Build web assets
        script: |
          cd artifacts/qr-scanner
          PORT=3000 BASE_PATH=./ pnpm run build

      # ── 4. Sync web assets into Android project ───────────────────────────
      #    Use local Capacitor CLI (avoids npx downloading a different version)
      - name: Capacitor sync
        script: |
          cd artifacts/qr-scanner
          pnpm exec cap sync android

      # ── 5. Decode & write the keystore file ───────────────────────────────
      - name: Set up keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/release.keystore

      # ── 6. Build signed AAB (Play Store only) ────────────────────────────
      #    Only bundleRelease — Play Store only accepts AABs; APK removed to
      #    halve build time. store.type=PKCS12 required (OpenSSL keystore).
      #    JAVA_HOME set explicitly; java:21 env doesn't always reach Gradle.
      #    SDK licenses accepted non-interactively to prevent silent hangs.
      - name: Build Android release
        script: |
          # Accept all Android SDK licenses non-interactively (prevents hangs)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Resolve Java 21 home — try common Codemagic/Ubuntu JDK paths
          JAVA21=$(find /usr/lib/jvm -maxdepth 1 -type d -name "*21*" 2>/dev/null | head -1)
          [ -z "$JAVA21" ] && JAVA21=$(find /usr/local/lib/jvm -maxdepth 1 -type d -name "*21*" 2>/dev/null | head -1)
          [ -z "$JAVA21" ] && JAVA21=$(dirname $(dirname $(readlink -f $(which java))))
          export JAVA_HOME="$JAVA21"
          echo "Using JAVA_HOME: $JAVA_HOME"
          java -version

          cd artifacts/qr-scanner/android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/release.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD \
            -Pandroid.injected.signing.store.type=PKCS12

    artifacts:
      # AAB — required for Play Store upload (only output; APK removed to halve build time)
      - artifacts/qr-scanner/android/app/build/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - mos229189@gmail.com
        notify:
          success: true
          failure: true
