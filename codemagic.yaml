workflows:
  android-release:
    name: Scanner Pro — Android Release
    max_build_duration: 120

    environment:
      # Codemagic pre-installs Node 22 and sets PATH automatically.
      # java: 21 sets JAVA_HOME to the JDK 21 path on the build machine.
      node: 22.13.1
      java: 21
      vars:
        PACKAGE_NAME: "com.scanpro.app"
      groups:
        # Team → Global variables & secrets → Group name: keystore_credentials
        # Variables inside the group:
        #   CM_KEYSTORE          — base64-encoded PKCS12 keystore file
        #   CM_KEYSTORE_PASSWORD — store password
        #   CM_KEY_ALIAS         — key alias
        #   CM_KEY_PASSWORD      — key password
        - keystore_credentials

    # Only cache safe, portable artifacts (downloaded JARs + pnpm packages).
    # NEVER cache android/app/build — stale incremental state causes 2-hour hangs.
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.local/share/pnpm/store

    scripts:
      # ── 1. Ensure pnpm 9 is available ────────────────────────────────────
      - name: Install pnpm
        script: |
          set -euo pipefail
          node --version
          # Use if/else — more robust than && || chains under set -e
          if pnpm --version 2>/dev/null | grep -q "^9\."; then
            echo "pnpm $(pnpm --version) already installed — skipping"
          else
            npm install -g pnpm@9 --force
            echo "Installed pnpm $(pnpm --version)"
          fi

      # ── 2. Install workspace dependencies ────────────────────────────────
      - name: Install dependencies
        script: |
          set -euo pipefail
          # The lockfile is version 9 and is reproducible with pnpm 9.
          # Fail instead of silently changing dependency versions in CI.
          pnpm install --frozen-lockfile

      # ── 3. Type-check the application ──────────────────────────────────────
      - name: Type-check application
        script: |
          set -euo pipefail
          pnpm --filter @workspace/qr-scanner run typecheck

      # ── 4. Build the Vite web app ─────────────────────────────────────────
      - name: Build web assets
        script: |
          set -euo pipefail
          cd artifacts/qr-scanner
          PORT=3000 BASE_PATH=./ pnpm run build

      # ── 5. Copy web assets into the Android project ───────────────────────
      - name: Capacitor sync
        script: |
          set -euo pipefail
          cd artifacts/qr-scanner
          pnpm exec cap sync android

      # ── 6. Write and verify the keystore ──────────────────────────────────
      - name: Set up keystore
        script: |
          set -euo pipefail
          : "${CM_KEYSTORE:?CM_KEYSTORE is missing}"
          : "${CM_KEYSTORE_PASSWORD:?CM_KEYSTORE_PASSWORD is missing}"
          : "${CM_KEY_ALIAS:?CM_KEY_ALIAS is missing}"
          : "${CM_KEY_PASSWORD:?CM_KEY_PASSWORD is missing}"
          printf '%s' "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/release.keystore"
          test -s "$CM_BUILD_DIR/release.keystore"
          keytool -list \
            -keystore "$CM_BUILD_DIR/release.keystore" \
            -storetype PKCS12 \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" >/dev/null
          echo "Keystore and alias verified"

      # ── 7. Build signed AAB + release APK ─────────────────────────────────
      # Both tasks run in a single Gradle invocation so all compilation work
      # (compileReleaseJavaWithJavac, mergeReleaseResources, dexRelease, etc.)
      # is shared between them.  The extra cost over AAB-only is just the final
      # APK packaging step — typically < 30 s on Codemagic's M-series builders.
      #
      # PKCS12 flag required — keystore was generated with OpenSSL, not keytool.
      # JAVA_HOME: verified/overridden to ensure the Gradle daemon uses JDK 21.
      - name: Build Android release
        script: |
          set -euo pipefail

          # Accept all SDK licenses non-interactively (prevents silent hangs)
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

          # Verify / fix JAVA_HOME — prefer Codemagic's $JAVA_HOME, fall back to find
          if [ -z "${JAVA_HOME:-}" ] || ! "$JAVA_HOME/bin/java" -version 2>&1 | grep -q "21"; then
            JAVA_HOME=$(find /usr/lib/jvm /usr/local/lib/jvm -maxdepth 1 \
              -type d -name "*21*" 2>/dev/null | head -1)
          fi
          export JAVA_HOME
          echo "JAVA_HOME: $JAVA_HOME"
          "$JAVA_HOME/bin/java" -version

          cd artifacts/qr-scanner/android
          chmod +x gradlew

          ./gradlew clean bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/release.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type=PKCS12

      # ── 8. Build debug APK independently ──────────────────────────────────
      # Do not pass release signing injection to this task. This guarantees
      # app-debug.apk is signed with Android's standard debug key.
      - name: Build Android debug APK
        script: |
          set -euo pipefail
          cd artifacts/qr-scanner/android
          ./gradlew assembleDebug --no-daemon

      # ── 9. Verify all packaged artifacts ──────────────────────────────────
      - name: Verify Android artifacts
        script: |
          set -euo pipefail
          AAB="artifacts/qr-scanner/android/app/build/outputs/bundle/release/app-release.aab"
          RELEASE_APK="artifacts/qr-scanner/android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="artifacts/qr-scanner/android/app/build/outputs/apk/debug/app-debug.apk"

          for artifact in "$AAB" "$RELEASE_APK" "$DEBUG_APK"; do
            test -s "$artifact"
            unzip -tq "$artifact" >/dev/null
            echo "Verified archive: $artifact ($(wc -c < "$artifact") bytes)"
          done

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"

          # Capacitor web assets must be present inside both APKs.
          unzip -l "$RELEASE_APK" | grep -q 'assets/public/index.html'
          unzip -l "$DEBUG_APK" | grep -q 'assets/public/index.html'
          echo "All Android artifacts and embedded web assets verified"

    artifacts:
      - artifacts/qr-scanner/android/app/build/outputs/bundle/release/*.aab
      - artifacts/qr-scanner/android/app/build/outputs/apk/release/*.apk
      - artifacts/qr-scanner/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - mos229189@gmail.com
        notify:
          success: true
          failure: true
